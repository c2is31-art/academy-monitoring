name: Daily Academy Crawler Monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: 레포지토리 코드 가져오기
      uses: actions/checkout@v4

    - name: Python 3.10 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 패키지 및 Playwright 브라우저 설치
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install --with-deps chromium

    - name: 크롤러 실행 (메일 발송)
      run: python main.py

    - name: 수집 기록(History) GitHub에 자동 저장
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add crawl_history.json
        git commit -m "Auto-update crawl history [skip ci]" || echo "No changes to commit"
        git push
