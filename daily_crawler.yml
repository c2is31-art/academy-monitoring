name: Academy Crawler

on:
  workflow_dispatch: # 👈 Actions 탭에 '수동 실행' 버튼을 만들어주는 핵심 명령어
  # schedule:
  #   - cron: '0 0 * * *' # 만약 매일 KST 오전 9시(UTC 0시)에 자동 실행하고 싶다면 주석(#) 해제

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: 레포지토리 코드 가져오기
      uses: actions/checkout@v4

    - name: Python 3.10 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 패키지 및 Playwright 브라우저 설치
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install --with-deps chromium

    - name: 크롤러 실행 (메일 발송)
      run: python main.py