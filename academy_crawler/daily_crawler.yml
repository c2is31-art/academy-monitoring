name: Daily Academy Crawler Monitoring

on:
  schedule:
    # 매일 한국 시간(KST) 오전 08:00 실행 (UTC 기준 전날 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # GitHub 웹페이지에서 수동 실행(버튼 클릭)도 가능하게 설정

jobs:
  crawl-and-notify:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 playwright
        playwright install chromium
        playwright install-deps chromium

    - name: Run Crawler & Send Email
      run: |
        python main.py